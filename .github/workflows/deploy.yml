name: Deploy Loyalty Frontend to Server

on:
  push:
    branches:
      - anjana

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies and Build
        env:
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
          VITE_API: ${{ secrets.VITE_API }}
        run: |
          npm ci
          npm run build
         with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "dist/*"
          target: "~/deploy-temp"

      - name: Move to production folder & restart Nginx
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |

            echo "Deploying to web root..."
            sudo rm -rf /var/www/html/loyalty-frontend
            sudo mkdir -p /var/www/html/loyalty-frontend
            sudo cp -R ~/deploy-temp/* /var/www/html/loyalty-frontend
            sudo chown -R www-data:www-data /var/www/html/loyalty-frontend
            sudo chmod -R 755 /var/www/html/loyalty-frontend
            sudo rm -rf ~/deploy-temp

            # Clear nginx cache and restart
            echo "Restarting Nginx..."
            sudo rm -rf /var/cache/nginx/*
            sudo systemctl restart nginx

            echo "Deployment completed!"

            echo "${{ secrets.SERVER_PASSWORD }}" | sudo -S rm -rf /var/www/html/loyalty-frontend
            echo "${{ secrets.SERVER_PASSWORD }}" | sudo -S mv ~/deploy-temp/loyalty-frontend /var/www/html/
            echo "${{ secrets.SERVER_PASSWORD }}" | sudo -S rm -rf ~/deploy-temp
            echo "${{ secrets.SERVER_PASSWORD }}" | sudo -S rm -rf /var/cache/nginx/*
            echo "${{ secrets.SERVER_PASSWORD }}" | sudo -S systemctl restart nginx

